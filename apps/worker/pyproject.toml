[project]
name = "aks-worker"
version = "0.1.0"
description = "Aajke Ki Scene ingestion + AI orchestration worker"
requires-python = ">=3.11"
dependencies = [
    "aks-api",
    "httpx>=0.27",
    "feedparser>=6.0.11",
]

[tool.uv.sources]
aks-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["adapters", "pipeline", "worker.py"]
